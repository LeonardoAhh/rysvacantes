<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión - ViñoPlastic</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100dvh; margin: 0; place-items: center; background: #fff; color: #141414; padding: 24px; }
      main { width: min(100%, 28rem); }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; }
      p { margin: 0 0 24px; color: #707070; line-height: 1.5; }
      a { display: inline-flex; min-height: 44px; align-items: center; border-radius: 999px; background: #141414; color: #fff; padding: 0 20px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Revisa tu conexión para consultar las vacantes o entrar al panel.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
