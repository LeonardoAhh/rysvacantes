<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ViñoPlastic" />
    <script>
      const adminPage = /^\/(?:auth|dashboard|analytics)\/?$/.test(location.pathname)
      const manifest = document.createElement("link")
      manifest.rel = "manifest"
      manifest.href = adminPage ? "/admin.webmanifest" : "/app.webmanifest"
      document.head.append(manifest)
      if (adminPage) {
        document.querySelector('link[rel="icon"]').href = "/admin-icon.svg"
        document.querySelector('link[rel="apple-touch-icon"]').href =
          "/admin-apple-touch-icon.png"
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content =
          "Viño Admin"
      }
    </script>
    <!-- seo:start -->
    <!-- seo:end -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
